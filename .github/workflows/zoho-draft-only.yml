name: Bozza Zoho da newsletter.html esistente

on:
  workflow_dispatch: # crea la bozza Zoho dal newsletter.html già nel repo, senza rigenerarlo

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crea campagna Zoho
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_LIST_KEY: ${{ secrets.ZOHO_LIST_KEY }}
          ZOHO_TOPIC_ID: ${{ secrets.ZOHO_TOPIC_ID }}
          ZOHO_FROM_EMAIL: ${{ secrets.ZOHO_FROM_EMAIL }}
          ZOHO_FROM_NAME: "Giovanni"
          NEWSLETTER_HTML_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main/newsletter.html"
        run: node create-zoho-campaign.mjs
